name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Windows Config
        if: matrix.os == 'windows-2022'
        run: |
          git config --system core.longpaths true
          echo "Enabled long paths in git"

          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          echo "Enabled long paths in registry"

          $git_link = "C:\Program Files\Git\usr\bin\link.exe"
          if (Test-Path $git_link) {
              Rename-Item $git_link "_link.exe"
          }
          echo "Removed link.exe in git"

      - name: Setup MSVC
        if: matrix.os == 'windows-2022'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: 14.29
          arch: x64
          sdk: 10.0.19041.0

      - name: Checkout self
        uses: actions/checkout@v4

      - name: Checkout hx
        uses: actions/checkout@v4
        with:
          repository: helix-editor/helix
          ref: refs/tags/25.07.1
          path: hx

      - name: Copy config file
        shell: bash
        run: |
          mkdir -p hx/.cargo
          cp -f .cargo/config.toml hx/.cargo/

      - name: Cargo update
        shell: bash
        run: |
          cd hx
          rm -f Cargo.lock
          cargo update

      - name: Build
        run: |
          cd hx
          cargo b -r

      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: hx_${{ matrix.os }}
          path: |
            hx/target/release/hx
            hx/target/release/*.so

            hx/target/release/hx.exe
            hx/target/release/*.dll

            hx/runtime
